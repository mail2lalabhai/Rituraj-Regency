<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituraj Regency – Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f2;--card:#fff;--ink:#14292a;--mute:#5d7270;--line:#d3dedc;--brand:#0f4c4a;--due:#b3402a;--ok:#1f7a4d;--warn:#9a6b00}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a1a;--card:#152626;--ink:#e6f0ee;--mute:#92aba8;--line:#274040;--brand:#5fc4bb;--due:#ff8d73;--ok:#6fd6a0;--warn:#e8b64a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
h1{font-size:1.25rem;margin:0;color:var(--brand)}
h2{font-size:1.05rem;margin:0 0 8px;color:var(--brand)}
a,button{color:var(--brand)}
button,select,input{font:inherit;color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.total{font-size:2rem;font-weight:700;color:var(--due);line-height:1.1}
.mute{color:var(--mute);font-size:.875rem}
select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input[type=checkbox]{width:auto;padding:0;accent-color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px;text-align:left;cursor:pointer}
.chip b{display:block}.chip span{color:var(--due);font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.yb{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 14px;cursor:pointer}
.btn{border:1px solid var(--brand);background:none;border-radius:8px;padding:6px 14px;cursor:pointer}
.btn.main{background:var(--brand);color:var(--bg)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.c{text-align:left;white-space:normal;color:var(--mute);font-size:.85rem}
.due{color:var(--due);font-weight:700}.ok{color:var(--ok);font-weight:700}
.flag{color:var(--warn);cursor:help}
.err{color:var(--due)}.hide{display:none}
.row{display:flex;gap:8px}.row>*{flex:1}.row>button{flex:0 0 auto;padding:10px 16px}
code{background:var(--bg);padding:1px 5px;border-radius:4px;word-break:break-all}
#pin{min-width:0;font-family:system-ui,Arial,sans-serif;font-size:1.2rem;letter-spacing:.15em;color:#14292a;-webkit-text-fill-color:#14292a;background:#fff}
@media (prefers-color-scheme:dark){#pin{color:#e6f0ee;-webkit-text-fill-color:#e6f0ee;background:#152626}}
.nav{display:flex;gap:8px;margin-bottom:12px}
.nav a{padding:6px 18px;border:1px solid var(--line);border-radius:20px;text-decoration:none;background:var(--card)}
.nav a[aria-current=page]{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.tag{font-size:.7rem;border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:0 6px;margin-left:6px}
.pr{display:none}
@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#999;--brand:#000;--due:#000;--ok:#000;--warn:#000}
  body{background:#fff;color:#000;font-size:12px}
  .noprint,header{display:none!important}
  .pr{display:block;margin-bottom:10px}
  .wrap{max-width:none;padding:0}
  .card{border:0;padding:0}
  .scroll{overflow:visible}
  table{min-width:0}
  th,td{padding:4px 6px;white-space:normal}
  .yr,.mo{break-inside:avoid;margin-bottom:16px}
  .total{font-size:1.4rem}
}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Rituraj Regency · Maintenance</h1><span class="mute" id="stamp"></span></header>
<nav class="noprint nav"><a href="#" id="n1">Maintenance</a><a href="#expenses" id="n2">Expenses</a></nav>
<main id="app"><div class="card">Loading…</div></main>
</div>
<script>
/* ===== CONFIG – edit these lines ===== */
const SHEET_ID = '1HX1XBchu2cVcqgWlBM_5dat9_UAnPmwelTi_FroWO9s';
const API_KEY  = 'AIzaSyDoz4N54mx1SU7m0TZHsbxlzF5YkgNhA9c';
const REQUIRE_PIN = true;      // flats without a PIN row in the "Access" tab are blocked
const EXCLUDE_FROM_TOTAL = ['211', '503'];   // flats left out of the home-page total and list (reports still open from the dropdown)
const MAX_COLS = 'CZ', MAX_ROWS = 200;
/* Expenses tab: items whose text contains any of these words get a "special" tag (still counted in totals) */
const EXP_SPECIAL = ['tank 2','tanki','tank cover','tenk cover','tenk repair','lift drive','lift painting','nagar nigam','boring','old tank'];
/* Category summary: first matching pattern wins; unmatched items go to "Other" */
const EXP_CATS = [
  ['Water tanker', /tenk[ae]r|tanker/i],
  ['Guard salary', /guard|gaurd/i],
  ['Electricity', /elec|bijli|mpbeb|light|bulb|charging/i],
  ['Garbage (kachra)', /kachra|kachara|nagar nigam/i],
  ['Lift', /lift/i],
  ['Water tank & plumbing', /tank|tenk|plumb|boring|pipe|moter|motor|water bell|dvc/i],
  ['Cleaning', /clean|safai|chamber|duct|jhadu|pocha|finayel|acid/i],
  ['Repairs & other works', /repair|work/i]
];
/* ========================================= */

const API = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID;
const MON = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const MONFULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const $ = id => document.getElementById(id);
const app = $('app');
const inr = n => '₹' + Math.abs(Math.round(n)).toLocaleString('en-IN');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { if (typeof v === 'number') return v; const n = parseFloat(String(v ?? '').replace(/[₹,\s]/g, '')); return isNaN(n) ? 0 : n; };
const norm = v => String(v ?? '').toLowerCase().replace(/[\s.]/g, '');
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
const hashPin = (flat, pin) => sha('rr|' + flat + '|' + pin);

const state = { years: {}, access: {}, accessOk: false, sel: null, exp: {}, expSel: null };

async function api(path) {
  const r = await fetch(API + path + (path.includes('?') ? '&' : '?') + 'key=' + API_KEY);
  if (!r.ok) throw new Error('Google Sheets returned ' + r.status + '. Check the sheet ID, API key and that the sheet is shared as "Anyone with the link – Viewer".');
  return r.json();
}

/* Parse one year sheet by reading its header labels, not fixed column numbers. */
function parseYear(title, rows) {
  const h = rows.findIndex(r => norm(r[1]) === 'name');
  if (h < 0) return null;
  const hdr = rows[h], grp = rows[h + 1] || [], sub = rows[h + 2] || [];
  const starts = [];
  hdr.forEach((v, c) => { const m = MON.indexOf(norm(v).slice(0, 3)); if (m >= 0 && /^[a-z]+$/.test(norm(v))) starts.push({ c, m }); });
  const dueCol = hdr.findIndex(v => norm(v) === 'totaldue');
  const blocks = [];
  starts.forEach((s, i) => {
    if (/water/i.test(grp[s.c] || '')) return;           // water blocks are empty in the sheet; skipped
    const end = i + 1 < starts.length ? starts[i + 1].c : (dueCol > 0 ? dueCol : sub.length + 4);
    const b = { m: s.m };
    for (let c = s.c; c < end; c++) {
      const l = norm(sub[c]), g = norm(grp[c]);
      if (l === 'olddue') b.old = c; else if (l === 'old+current') b.oc = c;
      else if (l === 'received') b.rec = c; else if (l === 'tenk') b.tank = c;
      if (g === 'comments') b.com = c;
    }
    if (b.oc !== undefined && b.rec !== undefined) blocks.push(b);
  });
  const flats = {};
  for (const r of rows.slice(h + 3)) {
    const flat = String(r[2] ?? '').trim();
    if (norm(r[1]) === 'total') break;
    if (!flat) continue;
    const months = blocks.map(b => {
      const old = num(r[b.old]), oc = num(r[b.oc]);
      const rec = num(r[b.rec]), tank = b.tank !== undefined ? num(r[b.tank]) : 0;
      return { m: b.m, old, billed: oc - old, rec, tank, bal: oc - rec - tank, comment: String(r[b.com] ?? '').trim() };
    });
    months.forEach((x, i) => { const n = months[i + 1]; if (n && Math.abs(n.old - x.bal) > 0.5) n.mismatch = x.bal; });
    const last = [...months].reverse().find(x => x.billed || x.rec || x.tank);
    flats[flat] = { name: String(r[1] ?? '').trim(), months, due: dueCol > 0 && r[dueCol] !== undefined ? num(r[dueCol]) : (last ? last.bal : 0) };
  }
  return { year: +title, flats };
}

/*EXP-PARSE-START*/
/* Expences_<year>: month blocks side by side (Sr No, Paid By, Paid to/for, Amount, Comments); Paid By is never read. */
function parseExp(title, rows) {
  const FULL = MONFULL.map(m => m.toLowerCase());
  const mr = rows.findIndex(r => r.filter(v => FULL.includes(norm(v))).length >= 3);
  if (mr < 0) return parseExp2024(title, rows);
  const hdr = rows[mr], sub = rows[mr + 1] || [], starts = [], months = {};
  hdr.forEach((v, c) => { const m = FULL.indexOf(norm(v)); if (m >= 0) starts.push({ c, m }); });
  starts.forEach((s, i) => {
    const end = i + 1 < starts.length ? starts[i + 1].c : Math.max(hdr.length, sub.length) + 1;
    let it, am, cm;
    for (let c = s.c; c < end; c++) { const l = norm(sub[c]); if (l === 'paidto/for') it = c; else if (l === 'amount') am = c; else if (l === 'comments') cm = c; }
    if (it === undefined || am === undefined) return;
    const items = []; let sheetTotal = null;
    for (const r of rows.slice(mr + 2)) {
      if (norm(r[s.c]) === 'total') { sheetTotal = num(r[am]); break; }
      const name = String(r[it] ?? '').trim(), amt = num(r[am]);
      if (name && amt) items.push({ name, amt, comment: cm !== undefined ? String(r[cm] ?? '').trim() : '' });
    }
    months[s.m] = { items, sheetTotal };
  });
  return { year: +String(title).match(/20\d\d/)[0], months };
}
/* Old vertical layout (Expences_2024): "Aug-24" label, then Paid to / Amount rows until Total */
function parseExp2024(title, rows) {
  const months = {}; let cur = null;
  for (const r of rows) {
    let tag = r[5];
    if (typeof tag === 'number' && tag > 40000) { tag = new Date(Math.round((tag - 25569) * 864e5)); tag = MON[tag.getUTCMonth()] + '-' + String(tag.getUTCFullYear()).slice(2); }
    tag = String(tag ?? '').trim();
    const mm = tag.match(/^([A-Za-z]{3})-(\d{2})$/);
    if (mm) { const m = MON.indexOf(mm[1].toLowerCase()); cur = m >= 0 ? (months[m] = { items: [], sheetTotal: null }) : null; continue; }
    if (!cur) continue;
    const l = norm(tag);
    if (!l || l === 'paidto') continue;
    if (l === 'total') { cur.sheetTotal = num(r[6]); cur = null; continue; }
    const amt = num(r[6]);
    if (amt) cur.items.push({ name: tag, amt, comment: '' });
  }
  return { year: +String(title).match(/20\d\d/)[0], months };
}
/*EXP-PARSE-END*/

async function load() {
  const meta = await api('?fields=sheets.properties.title');
  const titles = meta.sheets.map(s => s.properties.title);
  const yrs = titles.filter(t => /^20\d\d$/.test(t)).sort();
  const want = yrs.concat(titles.filter(t => /^expen[cs]es_20\d\d$/i.test(t)), titles.includes('Access') ? ['Access'] : []);
  const q = want.map(t => 'ranges=' + encodeURIComponent("'" + t + "'!A1:" + MAX_COLS + MAX_ROWS)).join('&');
  const data = await api('/values:batchGet?valueRenderOption=UNFORMATTED_VALUE&' + q);
  data.valueRanges.forEach((vr, i) => {
    const t = want[i], rows = vr.values || [];
    if (t === 'Access') { state.accessOk = true; rows.forEach(r => { if (r[0] !== undefined && r[1]) state.access[String(r[0]).trim()] = String(r[1]).trim().toLowerCase(); }); }
    else if (/^expen/i.test(t)) { const e = parseExp(t, rows); if (e) state.exp[e.year] = e; }
    else { const y = parseYear(t, rows); if (y) state.years[y.year] = y; }
  });
  $('stamp').textContent = 'Loaded ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

const flatKeys = () => {
  const ys = Object.keys(state.years).sort(); const set = new Set();
  ys.forEach(y => Object.keys(state.years[y].flats).forEach(f => set.add(f)));
  return [...set].sort((a, b) => (parseInt(a) || 9999) - (parseInt(b) || 9999) || a.localeCompare(b));
};
const latestYear = () => Math.max(...Object.keys(state.years).map(Number));

/* ---------- Home ---------- */
function home() {
  const ly = state.years[latestYear()];
  const list = flatKeys().map(f => ({ f, due: ly.flats[f] ? ly.flats[f].due : 0 }));
  const pending = list.filter(x => x.due > 0).sort((a, b) => b.due - a.due);
  const counted = pending.filter(x => !EXCLUDE_FROM_TOTAL.includes(x.f));
  const total = counted.reduce((s, x) => s + x.due, 0);
  const cleared = list.length - pending.length;
  app.innerHTML = `
    <div class="card"><div class="mute">Total pending, ${counted.length} flats</div><div class="total">${inr(total)}</div></div>
    <div class="card"><label for="pick" class="mute">View your flat's month-wise report</label>
      <select id="pick"><option value="">Select flat number</option>${flatKeys().map(f => `<option>${esc(f)}</option>`).join('')}</select></div>
    <div class="card"><b>Flats with pending maintenance</b>
      <div class="grid" style="margin-top:10px">${counted.map(x => `<button class="chip" data-f="${esc(x.f)}"><b>${/^\d+$/.test(x.f) ? 'Flat ' : ''}${esc(x.f)}</b><span>${inr(x.due)}</span></button>`).join('')}</div>
      <p class="mute">${cleared} flats are fully paid or in advance.</p></div>`;
  $('pick').onchange = e => e.target.value && (location.hash = 'flat=' + encodeURIComponent(e.target.value));
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => location.hash = 'flat=' + encodeURIComponent(b.dataset.f));
}

/* ---------- PIN gate ---------- */
function gate(flat, ok) {
  ok = ok || (() => report(flat));
  const key = 'rr_ok_' + flat, stored = state.access[flat];
  if (sessionStorage.getItem(key) === stored && stored) return ok();
  app.innerHTML = `<p><a href="#">← All flats</a></p><div class="card"><b>${flat === 'EXPENSES' ? 'Expenses' : 'Flat ' + esc(flat)}</b>
    <p class="mute">Enter the PIN the committee gave you.</p>
    <div class="row"><input id="pin" type="password" inputmode="numeric" maxlength="12" autocomplete="off" aria-label="PIN"><button id="go">Open</button></div>
    <label class="mute" style="display:block;margin-top:8px"><input type="checkbox" id="sp" style="display:inline;vertical-align:middle"> Show PIN</label>
    <p id="msg" class="err"></p></div>`;
  if (REQUIRE_PIN && !stored) { $('msg').textContent = 'No PIN is set for this flat yet. Please ask the committee.'; return; }
  const submit = async () => {
    if ((await hashPin(flat, $('pin').value.trim())) === stored) { sessionStorage.setItem(key, stored); ok(); }
    else $('msg').textContent = 'That PIN is not correct.';
  };
  $('go').onclick = submit; $('pin').onkeydown = e => { if (e.key === 'Enter') submit(); };
  $('sp').onchange = e => { $('pin').type = e.target.checked ? 'text' : 'password'; };
  $('pin').focus();
}

/* ---------- Flat report: pick years with checkboxes, then print ---------- */
function report(flat) {
  const ys = Object.keys(state.years).map(Number).filter(y => state.years[y].flats[flat]).sort();
  if (!ys.length) { app.innerHTML = '<p><a href="#">← All flats</a></p><div class="card">No records for this flat.</div>'; return; }
  if (!state.sel || state.sel.flat !== flat) state.sel = { flat, years: new Set([ys[ys.length - 1]]) };
  const sel = state.sel.years, chosen = ys.filter(y => sel.has(y));
  const top = state.years[ys[ys.length - 1]].flats[flat];
  const latest = state.years[latestYear()].flats[flat];
  const due = latest ? latest.due : top.due;
  let gB = 0, gP = 0;
  const sections = chosen.map(y => {
    const f = state.years[y].flats[flat];
    const rows = f.months.filter(x => x.billed || x.rec || x.tank || x.comment);
    const tR = rows.reduce((s, x) => s + x.rec + x.tank, 0), tB = rows.reduce((s, x) => s + x.billed, 0);
    gB += tB; gP += tR;
    return `<section class="yr card scroll"><h2>${y}${f.name ? ' · ' + esc(f.name) : ''}</h2>${rows.length ? `<table><thead><tr><th>Month</th><th>Old due</th><th>Billed</th><th>Paid</th><th>Pending</th><th>Note</th></tr></thead><tbody>
      ${rows.map(x => `<tr><td>${MONFULL[x.m].slice(0, 3)} ${y}</td><td>${inr(x.old)}${x.old < 0 ? ' Cr' : ''}</td><td>${inr(x.billed)}</td>
        <td>${inr(x.rec + x.tank)}</td><td class="${x.bal > 0 ? 'due' : 'ok'}">${x.bal < 0 ? inr(x.bal) + ' Cr' : inr(x.bal)}${x.mismatch !== undefined ? ` <span class="flag" title="Previous month closed at ${inr(x.mismatch)}, but this month opens differently.">⚠</span>` : ''}</td>
        <td class="c">${x.tank ? 'Incl. special tank levy. ' : ''}${esc(x.comment)}</td></tr>`).join('')}
      <tr><th>Year total</th><th></th><th>${inr(tB)}</th><th>${inr(tR)}</th><th></th><th></th></tr></tbody></table>`
      : '<p class="mute">No bills or payments recorded for this year yet.</p>'}</section>`;
  }).join('');
  app.innerHTML = `<p class="noprint"><a href="#">← All flats</a></p>
    <div class="pr"><h1>Rituraj Regency – Maintenance Statement</h1>
      <div>Flat ${esc(flat)}${top.name ? ' · ' + esc(top.name) : ''} · Years: ${chosen.join(', ') || 'none'} · Printed ${new Date().toLocaleDateString('en-IN')}</div></div>
    <div class="card"><div class="mute noprint">Flat ${esc(flat)}${top.name ? ' · ' + esc(top.name) : ''}</div>
      <div class="mute">Pending now</div>
      <div class="total ${due > 0 ? '' : 'ok'}">${due > 0 ? inr(due) : due < 0 ? inr(due) + ' advance' : 'Nil'}</div></div>
    <div class="card noprint"><b>Select years to view or print</b>
      <div class="tabs" role="group" aria-label="Years">${ys.map(y => `<label class="yb"><input type="checkbox" data-y="${y}" ${sel.has(y) ? 'checked' : ''}> ${y}</label>`).join('')}
        <button class="btn" id="all">${chosen.length === ys.length ? 'Clear all' : 'Select all'}</button>
        <button class="btn main" id="prt" ${chosen.length ? '' : 'disabled'}>Print / Save PDF</button></div></div>
    ${sections || '<div class="card mute">Select at least one year.</div>'}
    ${chosen.length > 1 ? `<div class="card"><b>Selected years: billed ${inr(gB)} · paid ${inr(gP)}</b></div>` : ''}
    <p class="mute">Cr = credit (paid in advance). ⚠ means the opening balance does not match the previous month's closing balance; ask the committee to check.</p>`;
  app.querySelectorAll('.yb input').forEach(cb => cb.onchange = () => { cb.checked ? sel.add(+cb.dataset.y) : sel.delete(+cb.dataset.y); report(flat); });
  $('all').onclick = () => { chosen.length === ys.length ? sel.clear() : ys.forEach(y => sel.add(y)); report(flat); };
  $('prt').onclick = () => window.print();
}

/* ---------- Expenses: month-wise, year by year ---------- */
function expView() {
  const ys = Object.keys(state.exp).map(Number).filter(y => Object.values(state.exp[y].months).some(m => m.items.length)).sort();
  if (!ys.length) { app.innerHTML = '<div class="card">No expense records found.</div>'; return; }
  if (!state.expSel) state.expSel = new Set([ys[ys.length - 1]]);
  const sel = state.expSel, chosen = ys.filter(y => sel.has(y));
  const fm = v => (v < 0 ? '−' + inr(v) + ' Cr' : inr(v));
  const special = n => EXP_SPECIAL.some(w => n.toLowerCase().includes(w));
  const catOf = n => (EXP_CATS.find(([, re]) => re.test(n)) || ['Other'])[0];
  let grand = 0;
  const secs = chosen.map(y => {
    const mo = state.exp[y].months;
    const idx = Object.keys(mo).map(Number).filter(m => mo[m].items.length).sort((a, b) => a - b);
    let yt = 0; const cats = {}, blocks = [];
    for (let m = idx[0]; m <= idx[idx.length - 1]; m++) {
      const d = mo[m];
      if (!d || !d.items.length) { blocks.push(`<section class="mo card"><h2>${MONFULL[m]} ${y}</h2><p class="mute">No expenses entered yet.</p></section>`); continue; }
      const t = d.items.reduce((s, x) => s + x.amt, 0); yt += t;
      d.items.forEach(x => { const c = catOf(x.name); cats[c] = (cats[c] || 0) + x.amt; });
      const bad = d.sheetTotal !== null && Math.abs(d.sheetTotal - t) > 0.5;
      blocks.push(`<section class="mo card scroll"><h2>${MONFULL[m]} ${y}</h2><table><thead><tr><th>Item</th><th>Note</th><th>Amount</th></tr></thead><tbody>
        ${d.items.map(x => `<tr><td>${esc(x.name)}${special(x.name) ? '<span class="tag">special</span>' : ''}</td><td class="c">${esc(x.comment)}</td><td>${fm(x.amt)}</td></tr>`).join('')}
        <tr><th>Month total</th><th></th><th>${fm(t)}${bad ? ` <span class="flag" title="The sheet's own total for this month is ${inr(d.sheetTotal)}; the items add up to ${inr(t)}.">⚠</span>` : ''}</th></tr></tbody></table></section>`);
    }
    grand += yt;
    const catRows = Object.entries(cats).sort((a, b) => b[1] - a[1]);
    return `<h2 style="margin-top:18px">${y}</h2>
      <section class="mo card scroll"><b>${y} by category</b><table><thead><tr><th>Category</th><th>Amount</th></tr></thead><tbody>
        ${catRows.map(([c, v]) => `<tr><td>${esc(c)}</td><td>${fm(v)}</td></tr>`).join('')}
        <tr><th>Year total</th><th>${fm(yt)}</th></tr></tbody></table></section>${blocks.join('')}`;
  }).join('');
  app.innerHTML = `<div class="pr"><h1>Rituraj Regency – Expenses Statement</h1><div>Years: ${chosen.join(', ') || 'none'} · Printed ${new Date().toLocaleDateString('en-IN')}</div></div>
    <div class="card noprint"><b>Select years to view or print</b>
      <div class="tabs" role="group" aria-label="Years">${ys.map(y => `<label class="yb"><input type="checkbox" data-y="${y}" ${sel.has(y) ? 'checked' : ''}> ${y}</label>`).join('')}
        <button class="btn" id="eall">${chosen.length === ys.length ? 'Clear all' : 'Select all'}</button>
        <button class="btn main" id="eprt" ${chosen.length ? '' : 'disabled'}>Print / Save PDF</button></div></div>
    ${secs || '<div class="card mute">Select at least one year.</div>'}
    ${chosen.length > 1 ? `<div class="card"><b>Total for selected years: ${fm(grand)}</b></div>` : ''}
    <p class="mute">Cr = credit (money back, reduces the total). "special" marks one-off items that are still included in the totals. ⚠ means the items do not add up to the total written in the sheet.</p>`;
  app.querySelectorAll('.yb input').forEach(cb => cb.onchange = () => { cb.checked ? sel.add(+cb.dataset.y) : sel.delete(+cb.dataset.y); expView(); });
  $('eall').onclick = () => { chosen.length === ys.length ? sel.clear() : ys.forEach(y => sel.add(y)); expView(); };
  $('eprt').onclick = () => window.print();
}

/* ---------- Committee tool: #admin generates a PIN hash row for the "Access" tab ---------- */
function admin() {
  app.innerHTML = `<p><a href="#">← Back</a></p><div class="card"><b>Committee: create PIN entry</b>
    <p class="mute">Paste the result into the "Access" tab: flat in column A, hash in column B. Use 6+ digit PINs.</p>
    <div class="row"><input id="af" placeholder="Flat no." aria-label="Flat"><input id="ap" placeholder="PIN" aria-label="PIN"></div><p></p>
    <button id="ag">Generate</button><p><code id="ao"></code></p></div>`;
  $('ag').onclick = async () => { $('ao').textContent = $('af').value.trim() + '\t' + await hashPin($('af').value.trim(), $('ap').value.trim()); };
}

function route() {
  const ex = location.hash === '#expenses';
  $('n1').setAttribute('aria-current', ex ? 'false' : 'page'); $('n2').setAttribute('aria-current', ex ? 'page' : 'false');
  if (ex) return gate('EXPENSES', expView);
  if (location.hash === '#admin') return admin();
  const m = location.hash.match(/^#flat=(.+)$/);
  m ? gate(decodeURIComponent(m[1])) : home();
}
window.addEventListener('hashchange', route);
load().then(route).catch(e => { app.innerHTML = `<div class="card err">Could not load data. ${esc(e.message)}</div>`; });
</script>
</body>
